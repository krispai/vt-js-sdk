name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check docs and demo reference the published package name
        run: |
          NAME=$(node -p "require('./package.json').name")
          BAD=$(grep -rhoE '@krisp[a-z.]*/[a-z-]+' README.md demo/package.json demo/src \
                  | sort -u | grep -vx "$NAME" || true)
          if [ -n "$BAD" ]; then
            echo "::error::Expected only $NAME, found:"; echo "$BAD"; exit 1
          fi

      - name: Install SDK dependencies
        run: npm ci

      - name: Build SDK
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Install demo dependencies
        run: npm --prefix demo ci

      - name: Build demo
        run: npm --prefix demo run build
